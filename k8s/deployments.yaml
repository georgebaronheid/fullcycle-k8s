# kubectl apply -f k8s/deployments.yaml - this command applies this config file

# kubectl get deployments
# output:
# go-server

# kubectl get replicaset
# output:
# go-server-{REPLICASET-HASH}

# kubectl get pods
# output:
# go-server-{REPLICASET-HASH}-{POD-HASH}

# This is a living example of the composite nature of k8s and deployments.

# ROLLBACK
# kubectl rollout history deployment go-server
