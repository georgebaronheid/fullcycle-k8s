# Deployment > ReplicaSet > Pods - Hierarchical structure
# A deployment creates a replicaset, which creates pods.
# Therefore, if we compare replicaset.yaml and deployment.yaml, we'll see that the only difference is the kind, and they build onto each other.
apiVersion: apps/v1 # https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
kind: Deployment # As simples as it seems, this is the only difference when compared to replicaset.yaml
metadata:
  name: go-server
  labels:
    app: go-server

spec:
  selector:
    matchLabels:
      app: go-server
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1


  template:
    metadata: # this is a copy and paste of pod.yaml metadata and specs
      #      name: go-server # not required in this step
      labels:
        app: go-server
        context: backend

    spec:
      containers:
        - name: go-server
          image: "georgebaronheid/fullcycle-k8s:v1.3.2"

          # runs at startup until it works correctly, then it's disabled.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 3
            failureThreshold: 30

          # Both of these run only after startupProbe is successful
          # readiness means that the container is ready to serve traffic. If not ready it will not receive traffic.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 3
            failureThreshold: 2
            initialDelaySeconds: 10

          # liveness means the container is alive. If it's not alive, it will be restarted.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 1
            timeoutSeconds: 1
            successThreshold: 1
            initialDelaySeconds: 10

          ports:
            - containerPort: 8080
              name: go-server-ports
          envFrom: # most straightforward way to reference a configmap
            - configMapRef:
                name: go-server-env
            - secretRef:
                name: go-server-secrets

          volumeMounts: # monta um volume que declaramos abaixo
            - mountPath: /app/myfamily # /app é o diretório do container - Workdir do dockerfile
              name: config # same as the configmap name
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: configmap-family
            items:
              - key: members
                path: family.txt


